<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Paya mark: a glossy liquid "P" with a droplet — money, in one drop.
    Black "liquid glass": dark body gradient, soft specular highlights,
    a rim light along the lower-right edge. Scales from 16px to print.
  -->
  <defs>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4a4a4f"/>
      <stop offset="0.38" stop-color="#111113"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="drop" cx="0.32" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#6a6a70"/>
      <stop offset="0.45" stop-color="#121214"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <!-- The letterform: stem + bowl, with the counter knocked out. -->
    <mask id="p" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <path fill="#fff" d="M30 10 h0 c6 0 11 5 11 11 v62 c0 7-5 11-11 11 c-6 0-11-4-11-11 V21 c0-6 5-11 11-11z"/>
      <circle cx="52" cy="37" r="25" fill="#fff"/>
      <circle cx="52" cy="37" r="9.5" fill="#000"/>
    </mask>
  </defs>

  <!-- Body -->
  <g mask="url(#p)">
    <rect width="100" height="100" fill="url(#body)"/>
    <!-- broad top-left sheen -->
    <ellipse cx="38" cy="22" rx="20" ry="9" fill="#fff" opacity="0.42" filter="url(#soft)"/>
    <!-- tight specular hit -->
    <ellipse cx="33" cy="17" rx="7" ry="3.2" fill="#fff" opacity="0.9" filter="url(#softer)"/>
    <!-- secondary sheen on the bowl -->
    <ellipse cx="66" cy="26" rx="8" ry="4" fill="#fff" opacity="0.35" filter="url(#soft)"/>
    <!-- rim light, lower right -->
    <path d="M30 94 c6 0 11-4 11-11 V60 M52 62 a25 25 0 0 0 25-25 a25 25 0 0 0-8-18"
          fill="none" stroke="url(#rim)" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
    <!-- subtle reflection on the stem -->
    <rect x="22" y="48" width="4" height="30" rx="2" fill="#fff" opacity="0.12" filter="url(#softer)"/>
  </g>

  <!-- Droplet -->
  <g>
    <circle cx="77" cy="80" r="9" fill="url(#drop)"/>
    <ellipse cx="73.5" cy="76" rx="3.2" ry="1.9" fill="#fff" opacity="0.85" filter="url(#softer)"/>
    <path d="M70 84 a9 9 0 0 0 14-2" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
