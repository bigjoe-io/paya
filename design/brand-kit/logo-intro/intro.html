<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Paya intro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; font-family: Inter, sans-serif; }
  body { background: #000; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; perspective: 120vmin; }
  #lockup { display: flex; align-items: center; gap: 4.5vmin; will-change: transform; }
  #mark { width: 26vmin; height: 26vmin; overflow: visible; will-change: transform; }
  #word { display: flex; font-size: 22vmin; font-weight: 600; letter-spacing: -0.05em; line-height: 1; overflow: hidden; padding: 0 0.02em 0.18em; margin-bottom: -0.18em; }
  #word span { display: inline-block; will-change: transform, opacity; }
  #tag { position: absolute; left: 0; right: 0; bottom: 18vh; text-align: center; font-size: 3.4vmin; font-weight: 500; letter-spacing: -0.01em; }
  /* faint money glitter in the background */
  #glitter { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #glitter span { position: absolute; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; will-change: transform, opacity; }
  #flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
  /* square and portrait: smaller lockup so it keeps comfortable margins */
  @media (max-aspect-ratio: 4/3) {
    #mark { width: 19vmin; height: 19vmin; }
    #word { font-size: 16vmin; }
    #lockup { gap: 3.4vmin; }
    #tag { font-size: 3.6vmin; bottom: 22vh; }
  }
</style>
</head>
<body>
<div id="glitter"></div>
<div id="stage">
  <div id="lockup">
    <svg id="mark" viewBox="0 0 100 100">
      <path id="half" d="M68 20a30 30 0 0 1 0 60z" />
      <circle id="full" cx="32" cy="50" r="30" />
    </svg>
    <div id="word"><span>P</span><span>a</span><span>y</span><span>a</span></div>
  </div>
</div>
<p id="tag">NEAR to your bank, in one click.</p>
<div id="flash"></div>

<script>
/* Deterministic timeline: render(t) draws the frame at t seconds. Exported frame by frame. */
const DURATION = 4.2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOutBack = (p) => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const easeIn = (p) => p * p * p * p;
const easeOut = (p) => 1 - Math.pow(1 - p, 4);

const $ = (id) => document.getElementById(id);
const body = document.body, lockup = $("lockup"), mark = $("mark"), full = $("full"), half = $("half");
const letters = [...document.querySelectorAll("#word span")], word = $("word"), tag = $("tag"), flash = $("flash");

/* ---- background glitter: currency symbols and country codes, barely there ---- */
const GLYPHS = ["₦", "$", "GH₵", "KSh", "R", "TSh", "NG", "GH", "KE", "TZ", "ZA", "US", "₦", "$", "₦"];
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const glitterEl = document.getElementById("glitter");
const bits = Array.from({ length: 46 }, (_, i) => {
  const el = document.createElement("span");
  el.textContent = GLYPHS[i % GLYPHS.length];
  glitterEl.appendChild(el);
  return {
    el,
    x: rand() * 100, y: rand() * 100,                 // % of the frame
    size: 1.6 + rand() * 3.4,                          // vmin
    phase: rand() * Math.PI * 2, speed: 2 + rand() * 4, // twinkle
    drift: (rand() - 0.5) * 3, rise: 1 + rand() * 2.5,  // vmin per second
    peak: 0.04 + rand() * 0.08,                         // max opacity
    rot: (rand() - 0.5) * 30,
  };
});
// keep the middle clear so the logo always reads
// keep the logo and tagline area clear so they always read
for (const b of bits) if (Math.abs(b.x - 50) < 26 && b.y > 34 && b.y < 86) b.y = b.y < 58 ? b.y - 22 : Math.min(98, b.y + 16);

function renderGlitter(t, fg) {
  // fades in with the first pop, dips during the dive, returns on white
  const presence = Math.min(seg(t, 0.1, 0.8), 1 - 0.85 * seg(t, 1.05, 1.42) + 0.85 * seg(t, 1.6, 2.2));
  for (const b of bits) {
    const tw = Math.pow(Math.max(0, Math.sin(b.phase + t * b.speed)), 3); // sparkle, mostly off
    b.el.style.opacity = (b.peak * (0.25 + 0.75 * tw) * presence).toFixed(3);
    b.el.style.color = fg;
    b.el.style.fontSize = b.size + "vmin";
    b.el.style.left = b.x + "%";
    b.el.style.top = b.y + "%";
    b.el.style.transform = `translate(${b.drift * t}vmin, ${-b.rise * t}vmin) rotate(${b.rot}deg) scale(${0.9 + 0.2 * tw})`;
  }
}

function render(t) {
  // Act 1 (0–1.45s): white on black. Act 2 (1.45s→): black on white.
  const inverted = t >= 1.45;
  const fg = inverted ? "#0a0a0a" : "#fff";
  body.style.background = inverted ? "#fff" : "#000";
  full.style.fill = half.style.fill = fg;
  word.style.color = tag.style.color = fg;
  renderGlitter(t, fg);

  // the word sits beside the mark; until it reveals, keep the mark centred
  const wordW = word.getBoundingClientRect().width;
  const gap = parseFloat(getComputedStyle(lockup).gap);
  const centreShift = (wordW + gap) / 2; // px to shift the lockup so the mark is centred
  const slide = easeInOut(seg(t, 2.05, 2.65)); // 0 → mark centred, 1 → lockup centred
  const offsetX = lerp(centreShift, 0, slide);

  let scale = 1, rotY = 0, rotZ = 0;
  let halfX = 0, halfO = 1, fullScale = 1;

  if (!inverted) {
    // 0.00–0.50 circle pops in
    fullScale = easeOutBack(seg(t, 0.0, 0.5));
    // 0.50–1.05 flip once around Y; the half slides out from behind the circle mid-flip
    rotY = 360 * easeInOut(seg(t, 0.5, 1.05));
    const out = easeOutBack(seg(t, 0.72, 1.05));
    halfX = lerp(-36, 0, out);
    halfO = seg(t, 0.72, 0.8);
    // 1.05–1.45 dive into the circle until the screen is white
    const z = seg(t, 1.02, 1.42);
    scale = lerp(1, 60, z * z * z); // dive through the circle: the screen is white before the cut
  } else {
    // 1.45–1.95 mark pops back, black on white, with a quarter turn
    const p = seg(t, 1.45, 1.95);
    scale = lerp(0.15, 1, easeOutBack(p));
    rotZ = lerp(-90, 0, easeOut(p));
    // 1.45–1.70 the half "clicks" back out
    halfX = lerp(-20, 0, easeOutBack(seg(t, 1.55, 1.85)));
    // 2.95–3.15 tiny settle "breath" on the finished lockup
    scale *= 1 + 0.025 * Math.sin(Math.PI * seg(t, 2.95, 3.35));
  }

  // zoom anchors on the circle's centre (32,50 of a 100 box)
  mark.style.transformOrigin = "32% 50%";
  mark.style.transform = `rotateY(${rotY}deg) rotateZ(${rotZ}deg) scale(${scale})`;
  full.style.transformBox = "fill-box"; full.style.transformOrigin = "center";
  full.style.transform = `scale(${fullScale})`;
  half.style.transform = `translateX(${halfX}px)`;
  half.style.transform = `translate(${halfX}%, 0)`;
  half.style.opacity = halfO;
  lockup.style.transform = `translateX(${offsetX}px)`;

  // 2.15–2.85 letters rise in, staggered
  letters.forEach((el, i) => {
    const p = easeOut(seg(t, 2.2 + i * 0.08, 2.65 + i * 0.08));
    el.style.transform = `translateY(${lerp(110, 0, p)}%)`;
    el.style.opacity = p > 0 ? 1 : 0;
  });

  // 3.05–3.5 tagline
  const tp = easeOut(seg(t, 3.05, 3.5));
  tag.style.opacity = tp;
  tag.style.transform = `translateY(${lerp(14, 0, tp)}px)`;
  tag.style.color = inverted ? "#52525b" : "#fff";

  // quick white flash at the cut, fading out
  flash.style.opacity = t >= 1.45 ? 1 - seg(t, 1.45, 1.6) : 0;
}

window.render = render;
window.renderGlitter = renderGlitter;
window.DURATION = DURATION;
// Live preview when opened directly in a browser.
if (!location.search.includes("export")) {
  let start;
  const loop = (now) => {
    start ??= now;
    render(((now - start) / 1000) % (DURATION + 0.8));
    requestAnimationFrame(loop);
  };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
} else render(0);
</script>
</body>
</html>
